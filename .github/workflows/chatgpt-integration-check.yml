name: ELDERNIGHT ChatGPT integration checks
on:
  pull_request:
    paths:
      - 'integrations/chatgpt/**'
      - '.github/workflows/chatgpt-integration-check.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/chatgpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
